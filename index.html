<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leonida Radio Dial</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=Pacifico&family=Outfit:wght@400;600;700&display=swap">
<style>
* { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }

/* Layout: one sunset hero with a script logo, then a wrapping grid of station "presets" — each card is the link. Single dusk theme by choice. */
:root {
  --night: #1a0b2e;
  --dusk: #2d1450;
  --pink: #ff4fa3;
  --cyan: #3ee6e0;
  --sun: #ffb36b;
  --cream: #fff3fa;
  --muted: #cdb6e6;
  --card: rgba(255,255,255,0.06);
  --display: "Pacifico", "Brush Script MT", cursive;
  --neon: "Monoton", "Outfit", sans-serif;
  --body: "Outfit", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
body {
  background: var(--night);
  color: var(--cream);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
}
.hero {
  margin-top: calc(-1 * env(safe-area-inset-top, 0px));
  padding-top: calc(env(safe-area-inset-top, 0px) + 3.5rem);
  padding-bottom: 5.5rem;
  background:
    radial-gradient(circle at 50% 108%, var(--sun) 0 9rem, transparent 9.1rem),
    linear-gradient(180deg, var(--night) 0%, var(--dusk) 45%, #7a1f6e 78%, var(--pink) 100%);
  position: relative;
  overflow: hidden;
  text-align: center;
}
.hero::after {
  /* sun stripes */
  content: "";
  position: absolute; left: 0; right: 0; bottom: 0; height: 5rem;
  background: repeating-linear-gradient(180deg, transparent 0 10px, #7a1f6e 10px 15px);
  -webkit-mask: radial-gradient(circle at 50% 100%, #000 0 9rem, transparent 9.1rem);
          mask: radial-gradient(circle at 50% 100%, #000 0 9rem, transparent 9.1rem);
}
.wrap {
  max-width: 1080px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  position: relative;
  z-index: 1;
}
.eyebrow {
  font-family: var(--neon);
  color: var(--cyan);
  letter-spacing: 0.12em;
  font-size: clamp(0.9rem, 2.4vw, 1.2rem);
  text-shadow: 0 0 12px rgba(62,230,224,0.7);
  margin: 0 0 0.25rem;
}
h1 {
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(3rem, 11vw, 6rem);
  line-height: 1.05;
  margin: 0;
  color: var(--pink);
  text-shadow: 0 0 6px rgba(255,79,163,0.8), 0 0 28px rgba(255,79,163,0.55), 3px 3px 0 var(--night);
  text-wrap: balance;
}
.sub {
  color: var(--cream);
  max-width: 34rem;
  margin: 0.9rem auto 0;
  font-size: 1.05rem;
}
main { padding-block: 2.5rem 3rem; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 14px;
  list-style: none;
  margin: 0; padding: 0;
}
.station {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  height: 100%;
  box-sizing: border-box;
  padding: 1.05rem 1.1rem 1rem;
  border-radius: 16px;
  background: var(--card);
  border: 1.5px solid rgba(62,230,224,0.25);
  color: inherit;
  text-decoration: none;
  transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease;
  min-width: 0;
}
.station:hover, .station:focus-visible {
  transform: translateY(-3px);
  border-color: var(--pink);
  background: rgba(255,79,163,0.10);
  box-shadow: 0 0 0 1px var(--pink), 0 8px 28px rgba(255,79,163,0.28);
  outline: none;
}
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; }
.name { font-weight: 700; font-size: 1.15rem; line-height: 1.25; }
.genre {
  flex: none;
  font-size: 0.68rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--night);
  background: var(--cyan);
  padding: 0.15rem 0.5rem;
  border-radius: 999px;
  white-space: nowrap;
}
.desc { color: var(--muted); font-size: 0.93rem; margin: 0; flex: 1; }
.play {
  margin-top: 0.4rem;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--sun);
  font-variant-numeric: tabular-nums;
}
.station:hover .play, .station:focus-visible .play { color: var(--pink); }
.station.soon { opacity: 0.6; border-style: dashed; }
.station.mix { border-color: rgba(255,179,107,0.45); }
.station.mix .genre { background: var(--sun); }
.station.soon:hover { transform: none; border-color: rgba(62,230,224,0.25); background: var(--card); box-shadow: none; }
.station.soon .play { color: var(--muted); }
footer {
  text-align: center;
  color: var(--muted);
  font-size: 0.85rem;
  padding-block: 0 2.5rem;
}
footer a { color: var(--cyan); }
@media (prefers-reduced-motion: reduce) {
  .station { transition: none; }
  .station:hover { transform: none; }
}

/* In-page radio deck (works where YouTube's player is allowed to load) */
.deck {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: rgba(26,11,46,0.96);
  border-top: 2px solid var(--pink);
  box-shadow: 0 -8px 30px rgba(255,79,163,0.25);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  backdrop-filter: blur(8px);
}
.deck-in {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.screen {
  width: 200px; height: 113px; flex: none;
  border-radius: 10px; overflow: hidden; background: #000;
  border: 1.5px solid var(--cyan);
}
.screen iframe { width: 100%; height: 100%; display: block; border: 0; }
.deck-info { display: flex; flex-direction: column; min-width: 0; flex: 1 1 180px; }
.deck-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--cyan); }
.deck-name { font-family: var(--display); font-weight: 400; font-size: 1.5rem; line-height: 1.2; color: var(--pink); }
.deck-msg { font-size: 0.85rem; color: var(--sun); }
.deck-ctl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.deck-ctl button, .deck-ctl a {
  font: 600 0.9rem var(--body);
  color: var(--night); background: var(--cyan);
  border: 0; border-radius: 999px; padding: 0.5rem 0.95rem;
  cursor: pointer; text-decoration: none;
}
.deck-ctl button:hover, .deck-ctl a:hover { background: var(--pink); color: var(--cream); }
.deck-ctl button:focus-visible, .deck-ctl a:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
.deck-ctl .ghost { background: transparent; color: var(--muted); border: 1.5px solid rgba(205,182,230,0.4); }
body.deck-open main { padding-bottom: 12rem; }
.station.on { border-color: var(--pink); box-shadow: 0 0 0 1px var(--pink), 0 0 24px rgba(255,79,163,0.35); }
.station.on .play::after { content: " · On air"; color: var(--pink); }
@media (max-width: 560px) {
  .screen { width: 100%; height: auto; aspect-ratio: 16 / 9; max-width: 100%; }
  body.deck-open main { padding-bottom: 26rem; }
}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <p class="eyebrow">GTA VI · Leonida</p>
    <h1>Vice City Radio</h1>
    <p class="sub">Pick a station, hop in the car. Every tap tunes in at a random song, just like flipping the dial mid-drive.</p>
  </div>
</header>

<main class="wrap">
  <ul class="grid" id="grid"></ul>
</main>

<footer class="wrap">
  Station uploads by <a href="https://www.youtube.com/@gta6-radiostation/videos" target="_blank" rel="noopener">GTA 6 Radio</a> on YouTube.
</footer>

<div class="deck" id="deck" hidden>
  <div class="deck-in">
    <div class="screen"><div id="yt"></div></div>
    <div class="deck-info">
      <span class="deck-label">Now playing</span>
      <span class="deck-name" id="deckName"></span>
      <span class="deck-msg" id="deckMsg"></span>

    <div class="deck-ctl">

      <a id="bOpen" href="#" target="_blank" rel="noopener" class="ghost">YouTube ↗</a>

  </div>
</div>

  $("deck").hidden = false;
  document.body.classList.add("deck-open");
  document.querySelectorAll(".station.on").forEach(el => el.classList.remove("on"));
  const card = document.querySelector(`.station[data-id="${id}"]`);
  if (card) card.classList.add("on");
  if (!player) {
    player = new YT.Player("yt", {
      width: "100%", height: "100%", videoId: id,
      playerVars: { start: t, autoplay: 1, playsinline: 1, rel: 0 },
      events: {
        onStateChange: e => { $("bPlay").textContent = e.data === 1 ? "Pause" : "Play"; },
        onError: () => {
          $("deckMsg").textContent = location.protocol === "file:"
            ? "YouTube won't play inside a page opened from your computer. Put the page online, or use the YouTube button."
            : "This one won't play here. Use the YouTube button to listen.";
        }
      }
    });
  } else {
    player.loadVideoById({ videoId: id, startSeconds: t });
  }
}

grid.addEventListener("click", e => {
  const a = e.target.closest("a.station[data-id]");
  if (!a || !ytReady || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  play(a.dataset.id, Number(a.dataset.t) || randomStart(a.dataset.id));
});
$("bPlay").addEventListener("click", () => {
  if (!player || !player.getPlayerState) return;
  player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo();
});
$("bSong").addEventListener("click", () => current && play(current, randomStart(current)));
$("bStation").addEventListener("click", () => {
  const others = ids.filter(x => x !== current);
  const next = others[Math.floor(Math.random() * others.length)];
  play(next, randomStart(next));
});
$("bClose").addEventListener("click", () => {
  if (player && player.stopVideo) player.stopVideo();
  $("deck").hidden = true;
  document.body.classList.remove("deck-open");
  document.querySelectorAll(".station.on").forEach(el => el.classList.remove("on"));
});
</script>
</body>
</html>
